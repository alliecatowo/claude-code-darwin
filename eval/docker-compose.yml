services:
  eval:
    build:
      context: ..
      dockerfile: eval/Dockerfile
    volumes:
      - ./results:/darwin/results
      - ./workdir:/darwin/workdir
    environment:
      - OPENCODE_EXPERIMENTAL_BACKGROUND_SUBAGENTS=1
      - DARWIN_HOME=/darwin/workdir/darwin-data
    # For SWE-bench grading (needs Docker socket):
    # Podman: DOCKER_HOST=unix:///run/podman/podman.sock, mount the socket
    # Docker:  mount /var/run/docker.sock
    # Uncomment one:
    # volumes:
    #   - /run/user/1000/podman/podman.sock:/var/run/docker.sock
    #   - /var/run/docker.sock:/var/run/docker.sock
